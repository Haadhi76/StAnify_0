    name: "Mathematics"
    topics:
      - id: "add_within_20"
        title: "Addition within 20 (no regrouping)"
        assumed_known: ["count_to_20", "meaning_of_equals"]
        allowed_new: ["number_bonds_to_10_and_20", "counting_on"]
        out_of_scope: ["carrying_regrouping", "column_addition", "negative_numbers"]
